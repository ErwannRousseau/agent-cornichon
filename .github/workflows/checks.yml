name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: deno fmt --check
      - run: deno lint
      - run: deno check --frozen manifest.ts triggers/cornichon.ts
      - run: deno test --frozen
